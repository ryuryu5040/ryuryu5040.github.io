# Sample workflow for building and deploying a Next.js site to GitHub Pages 
# 
# To get started with Next.js see: https://nextjs.org/docs/getting-started 
# 
name: Deploy Next.js site to Pages 
 
on: 
  # Runs on pushes targeting the default branch 
  push: 
    branches: ["main"] 
 
  # Allows you to run this workflow manually from the Actions tab 
  workflow_dispatch: 
 
# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages 
permissions: 
  contents: read 
  pages: write 
  id-token: write 
 
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued. 
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete. 
concurrency: 
  group: "pages" 
  cancel-in-progress: false 

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  PROJECT_DIR: tarkov-maps

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/${{ env.PROJECT_DIR }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            echo "lockpath=${{ env.PROJECT_DIR }}/yarn.lock" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/${{ env.PROJECT_DIR }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            echo "lockpath=${{ env.PROJECT_DIR }}/package-lock.json" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/${{ env.PROJECT_DIR }}/package.json" ]; then
            # lockが無い場合（推奨は lock をコミット）
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=npx --no-install" >> $GITHUB_OUTPUT
            echo "lockpath=" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager in subfolder: ${{ env.PROJECT_DIR }}"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
          # ★重要：サブフォルダのlockを見る
          cache-dependency-path: ${{ steps.detect-package-manager.outputs.lockpath }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Restore cache (.next/cache in subfolder)
        uses: actions/cache@v4
        with:
          # ★重要：サブフォルダの .next/cache
          path: |
            ${{ env.PROJECT_DIR }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles(format('{0}/package-lock.json', env.PROJECT_DIR), format('{0}/yarn.lock', env.PROJECT_DIR)) }}-${{ hashFiles(format('{0}/**/*.[jt]s', env.PROJECT_DIR), format('{0}/**/*.[jt]sx', env.PROJECT_DIR)) }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles(format('{0}/package-lock.json', env.PROJECT_DIR), format('{0}/yarn.lock', env.PROJECT_DIR)) }}-

      - name: Install dependencies (in subfolder)
        working-directory: ${{ env.PROJECT_DIR }}
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build with Next.js (in subfolder)
        working-directory: ${{ env.PROJECT_DIR }}
        run: ${{ steps.detect-package-manager.outputs.runner }} next build

      - name: Upload artifact (out in subfolder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PROJECT_DIR }}/out

